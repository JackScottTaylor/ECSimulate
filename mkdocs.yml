site_name: ECSimulate
site_description: "A Python package for simulating Electrochemistry"
site_author: "Jack Taylor"
repo_url: https://github.com/JackScottTaylor/ECSimulate
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - toc.integrate
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: pink
    - scheme: slate
      primary: indigo
      accent: pink
markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex  # For LaTeX math
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tasklist
extra_css:
  - stylesheets/extra.css  # optional custom tweaks
nav:
  - Home: index.md
  - Theory: theory.md
  - User Guide: user-guide.md
  - Developer Guide: developer-guide.md
